  if(L.b&&p.bpm<L.b[1]){p.bpm=Math.min(p.bpm+L.b[2],L.b[1]);return'Subes a '+p.bpm+' bpm 🚀'}
  if(s==='dedos'){p.ready=true;return'Llegaste a '+L.b[1]+' bpm: ¡haz el test de nivel en la pestaña Dedos para pasar al siguiente! 🎯'}
  if(p.lvl<LV[s].length-1){p.lvl++;const N=LV[s][p.lvl];p.bpm=N.b?N.b[0]:60;return'¡Nivel nuevo!: '+N.n+' 🎉'}
  return'Estás en el nivel máximo de esta habilidad: mantén y juega con musicalidad.';
}
function rate(s,r){
  const p=pr(s),L=LV[s][p.lvl];let msg;
  if(r==='ok'){p.good++;p.hard=0;msg=p.good>=2?advance(s):'Limpio ✅ Una más y subes.'}
  else if(r==='mid'){p.hard=0;msg='Bien. Repite igual en la próxima sesión.'}
  else{p.good=0;p.hard++;
    if(p.hard>=2){p.hard=0;if(L.b&&p.bpm>L.b[0]){p.bpm=Math.max(L.b[0],p.bpm-L.b[2]);msg='Bajas a '+p.bpm+' bpm para afirmar la técnica. Es parte del proceso 💪'}else msg='Repite despacio, sin apuro. Mañana sale mejor.'}
    else msg='Normal que cueste. Si te cuesta de nuevo, bajamos el tempo.'}
  return msg;
}
/* ============ EVENTOS ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a;
  if(a==='clsave')return saveClose();
  if(a==='pen')return penToggle();
  if(a==='rec'){const b=t.closest('[data-rec]');if(REC.mr){const same=REC.ctx===b.dataset.rec;recStop();if(!same)toast('Detuve la grabación anterior.');return}return recStart(b.dataset.rec,b.dataset.rt)}
  if(a.startsWith('recdel:')){if(!confirm('¿Borrar esta toma?'))return;ADB.del(a.slice(7)).then(()=>refreshRec());return}
  if(a==='nlibre'){const t=prompt('Nombre del cuaderno','Ideas y tabs');if(t)abrirCuaderno('libre:'+uid(),t.slice(0,60),'var(--purple)');return}
  if(a==='abrircu'){const k=t.dataset.k,n=NOTAS[paginasDe(k)[0]];abrirCuaderno(k,(n&&n.titulo)||'Cuaderno',n&&n.c,1);return}
  if(a.startsWith('nbgo:')){closePlayer();view='nb';nbTab=a.slice(5);nbEdit=null;render();window.scrollTo(0,0);return}
  if(P&&!$('#player').hidden&&$('#player').contains(t))return playerAct(a);
  const[k,x,y]=a.split(':');
  if(['nbt','pdone','pdel','padd','iedit','icancel','idel','iplay','iprev','isave','sedit','scancel','sdel','sst','ssave','gplay','grnd','gsave'].includes(k))return nbAct(k,x,y);
  if(k==='exp')return exportData();
  if(k==='imp'){const i=$('#impf');i.value='';i.click();return}
  if(k==='tab'){if(inKit()){Met.stop();if(Tn.on)tunerStop()}view=x;render();window.scrollTo(0,0)}
  else if(k==='ptab'){if(inKit()&&x!=='tools'){Met.stop();if(Tn.on)tunerStop()}pTab=x;render()}
  else if(k==='setup'){const pst=PRESETS[x];Object.keys(SK).forEach(s=>{const p=pr(s);p.lvl=pst.lv[s]||0;const L=LV[s][p.lvl];p.bpm=L.b?L.b[0]:60});st.setup=true;save();render()}
  else if(k==='mins'){st.mins=+x;save();render()}
  else if(k==='run'){startRun(plan(st.mins),+x)}
  else if(k==='startall'){const pl=plan(st.mins),h=today(),i=pl.findIndex(b=>!(h.done&&h.done[b[0]])),r=recommend()[0];if(i<0&&r&&!lesHoy())return startLesson(r.l.id);startRun(pl,i<0?0:i)}
  else if(k==='les'){startLesson(x)}
  else if(k==='ev'){startEval(x)}
  else if(k==='ef'){escF=x;if(view!=='escuela')view='escuela';render();window.scrollTo(0,0)}
  else if(k==='lv'){const p=pr(x),n=p.lvl+ +y;if(n>=0&&n<LV[x].length){p.lvl=n;const L=LV[x][n];p.bpm=L.b?L.b[0]:60;p.good=0;p.hard=0;p.ready=false;save();render()}}
  else if(k==='dtest'){openTest()}
  else if(k==='dlv'){const p=pr('dedos'),n=+x;if(n===p.lvl)return;if(n>p.lvl&&!confirm('¿Saltar a este nivel? Lo ideal es subir pasando el test de cada uno.'))return;p.lvl=n;p.bpm=LV.dedos[n].b[0];p.good=0;p.hard=0;p.ready=false;save();render();window.scrollTo(0,0)}
  else if(k==='theme'){st.theme=x;save();applyTheme();render()}
  else if(k==='reset'){if(confirm('¿Borrar todo tu progreso? No se puede deshacer.')){localStorage.removeItem('gd1');localStorage.removeItem(KN);NOTAS={};if(PN)cerrarCuaderno();st=load();fill();st.ui2=true;view='hoy';render()}}
  else if(k==='tb'){const T=toolsHTML;T.bpm=Math.max(30,Math.min(220,T.bpm+ +x));$('#tb').textContent=T.bpm;$('#tr').value=T.bpm;if(Met.on)Met.bpm=T.bpm}
  else if(k==='tbeats'){toolsHTML.beats=+x;if(Met.on)Met.beats=+x;render()}
  else if(k==='tmet'){if(Met.on){Met.stop()}else{Met.start(toolsHTML.bpm,1,toolsHTML.beats,(i,b,isB,acc)=>{const e=$('#tb');if(e){e.style.color=acc?'var(--accent)':'var(--cyan)';setTimeout(()=>e&&(e.style.color=''),90)}})}render()}
  else if(k==='ttap'){const n=performance.now(),T=toolsHTML;T.taps=(T.taps||[]).filter(z=>n-z<2500);T.taps.push(n);if(T.taps.length>=2){const d=(T.taps[T.taps.length-1]-T.taps[0])/(T.taps.length-1);T.bpm=Math.max(30,Math.min(220,Math.round(60000/d)));$('#tb').textContent=T.bpm;$('#tr').value=T.bpm;if(Met.on)Met.bpm=T.bpm}}
  else if(k==='tstart'){tunerStart()}
  else if(k==='tstop'){tunerStop()}
  else if(k==='ref'){refTone(+x)}
});
function applyTheme(){document.documentElement.setAttribute('data-theme',st.theme||'dark')}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
save();applyTheme();render();
</script>
