<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guitarra Diaria</title>
<meta name="description" content="Escuela de guitarra: lecciones de básico a avanzado, evaluaciones por habilidad, práctica diaria, metrónomo y afinador.">
<meta name="theme-color" content="#07090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guitarra">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=1" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<style>
:root{
  color-scheme:dark;
  --bg:#07090e; --surface:#0f131d; --surface2:#151b28; --surface3:#1c2436; --line:#2b364f;
  --ink:#f8fafc; --muted:#94a3b8; --faint:#5b6780;
  --accent:#f59e0b; --accent2:#ea580c; --accent-ink:#000; --accent-soft:rgba(245,158,11,.14);
  --cyan:#06b6d4; --teal:#06b6d4; --green:#10b981; --green-soft:rgba(16,185,129,.16); --red:#f43f5e; --red-soft:rgba(244,63,94,.15); --purple:#a855f7;
  --player:#07090e; --player-ink:#f8fafc; --player-muted:#94a3b8; --player-card:#0f131d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --round:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --dot:#0f131d;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f3f5f9; --surface3:#e6eaf1; --line:#d3d9e4;
  --ink:#0f172a; --muted:#56607a; --faint:#9aa3b5;
  --accent:#d97706; --accent2:#c2410c; --accent-ink:#fff; --accent-soft:rgba(217,119,6,.12);
  --cyan:#0891b2; --teal:#0891b2; --green:#059669; --green-soft:rgba(5,150,105,.12); --red:#e11d48; --red-soft:rgba(225,29,72,.1);
  --player:#eef1f6; --player-ink:#0f172a; --player-muted:#56607a; --player-card:#ffffff; --dot:#fff;
}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{
  color-scheme:light;
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f3f5f9; --surface3:#e6eaf1; --line:#d3d9e4;
  --ink:#0f172a; --muted:#56607a; --faint:#9aa3b5;
  --accent:#d97706; --accent2:#c2410c; --accent-ink:#fff; --accent-soft:rgba(217,119,6,.12);
  --cyan:#0891b2; --teal:#0891b2; --green:#059669; --green-soft:rgba(5,150,105,.12); --red:#e11d48; --red-soft:rgba(225,29,72,.1);
  --player:#eef1f6; --player-ink:#0f172a; --player-muted:#56607a; --player-card:#ffffff; --dot:#fff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);overflow-x:hidden;min-height:100vh}
/* ---------- estructura: barra lateral (tablet/PC) y barra inferior (celular) ---------- */
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font:900 15px var(--mono);display:grid;place-items:center;box-shadow:0 0 16px rgba(245,158,11,.35);flex:none}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.02em}
.brand p{font-size:11px;color:var(--muted);margin:0}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 14px var(--font);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left}
.nav button span{font-size:18px;width:22px;text-align:center}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(245,158,11,.35)}
.sidestats{margin-top:auto;display:grid;gap:6px}
.chip{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--muted)}
.chip b{font:800 13px var(--mono);color:var(--ink)}
main{min-width:0}
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.top .sub{margin:0}
.wrap{padding:20px 24px 40px;max-width:1360px}
.tabs{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
  .wrap{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 10.5px var(--font);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .tabs button span{font-size:20px;line-height:1}
  .tabs button.on{color:var(--accent)}
}
/* ---------- piezas ---------- */
h3{font-size:15px;font-weight:700;margin:0}
.h{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.h::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.cap{color:var(--muted);font-size:12px}
.mono{font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px}
.card.click{cursor:pointer;transition:border-color .12s,transform .12s}
.card.click:hover{border-color:var(--c,var(--accent))}
.g{display:grid;gap:12px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2>.card,.g3>.card{margin:0}
.split{display:grid;gap:12px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
@media (max-width:1050px){.split{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;border:1px solid transparent;border-radius:9px;padding:12px 14px;font:700 14px var(--font);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;cursor:pointer;transition:filter .12s,transform .08s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:rgba(245,158,11,.4)}
.btn.plain{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.btn.cyan{background:rgba(6,182,212,.16);color:var(--cyan);border-color:rgba(6,182,212,.45)}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.35;cursor:default}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:700 13px var(--font);padding:8px 6px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--accent);color:#000}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:700 12px var(--font);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--c,var(--accent));color:#000;border-color:var(--c,var(--accent))}
.badge{display:inline-flex;align-items:center;gap:5px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 40%,transparent);padding:3px 8px;border-radius:6px}
.lvtag{font:700 10.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.strip{border-left:3px solid var(--c,var(--accent))}
.bar{height:7px;border-radius:4px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:4px}
.stat{font:800 28px/1 var(--mono);letter-spacing:-.03em}
.ico{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px;flex:none}
.ico.done{background:var(--green-soft)}
.blk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.blk:first-of-type{border-top:0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-size:13px;color:#000}
.chk.on{background:var(--green);border-color:var(--green)}
.week{display:flex;gap:6px}
.week div{flex:1;text-align:center;font:600 11px var(--mono);color:var(--muted)}
.week i{display:block;height:44px;border-radius:6px;background:var(--surface3);margin-bottom:4px;position:relative;overflow:hidden}
.week i b{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,var(--accent2),var(--accent))}
.week .today i{outline:2px solid var(--accent)}
.hero{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),var(--surface);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.hero .t{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}
.why{font-size:13px;color:var(--muted);border-left:3px solid var(--c,var(--cyan));padding-left:10px;margin:10px 0}
.alts{display:grid;gap:6px;margin-top:10px}
.alt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);cursor:pointer;font-size:13px}
.alt:hover{border-color:var(--c)}
.areas{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.arow b{font:800 12px var(--mono);text-align:right}
svg.radar{width:100%;max-width:340px;display:block;margin:0 auto}
.les{display:flex;flex-direction:column;gap:6px;min-height:150px}
.les .t{font-weight:700;font-size:14.5px}
.les .st{margin-top:auto;font:700 11.5px var(--mono)}
.chordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.chordgrid .card{margin:0;padding:10px 6px;text-align:center}
.chordgrid b{display:block;font:700 14px var(--mono)}
svg.dg{width:100%;height:auto;max-width:96px;color:var(--ink)}
svg.fb{width:100%;max-width:560px;display:block;margin:6px auto;color:var(--ink)}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:11px;font:15px var(--font)}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea,select,input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:10px 11px;font:14px var(--font)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font:700 12px var(--font);color:var(--muted);margin:10px 0 0}
label.f>*{margin-top:5px;font-weight:400}
.fg{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.entry{border-left:3px solid var(--c,var(--line))}
.entry p{margin:6px 0 0;font-size:13.5px}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chs span{font:700 13px var(--mono);background:var(--surface3);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.chs span.on{background:var(--accent);color:#000}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
/* ---------- Cuaderno a mano (S Pen / dedo), igual que en Repaso Enfermería ---------- */
:root{--pw:min(46vw,580px)}
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--pw);z-index:45;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
.pn-top{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#pn-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 60px}
body.con-panel #player{right:var(--pw)}
body.con-panel .shell{margin-right:var(--pw)}
body.con-panel .tabs{right:var(--pw)}
@media (max-aspect-ratio:1/1){
  #panel{top:auto;left:0;width:auto;height:52%;border-left:0;border-top:2px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.35)}
  body.con-panel #player{right:0;bottom:52%}
  body.con-panel .shell{margin-right:0;padding-bottom:52vh}
  body.con-panel .tabs{display:none}
}
.lienzo{position:relative;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lienzo canvas{position:absolute;top:0;left:0;display:block}
.lienzo .lz-vivo{touch-action:none;cursor:crosshair}
.lz-barra{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lz-grupo{display:flex;gap:4px;align-items:center}
.lz-b{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:36px;min-width:36px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;font:700 13px var(--font)}
.lz-b.on{background:var(--accent);color:#000;border-color:var(--accent)}
.lz-b:disabled{opacity:.4;cursor:default}
.lz-b.peligro{color:var(--red);border-color:var(--red)}
.lz-color{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.lz-color.on{box-shadow:0 0 0 2px var(--accent)}
.lz-grosor{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;padding:0}
.lz-grosor span{display:block;border-radius:50%;background:var(--ink)}
.lz-grosor.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tapas{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tapa{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.tapa .hoja{display:block;aspect-ratio:1/1.2;overflow:hidden;padding:10px 10px 0;border:1px solid var(--line);border-left:12px solid var(--c,var(--accent));border-radius:6px 12px 12px 6px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface))}
.tapa canvas{display:block;width:100%;aspect-ratio:1/1.414;background:var(--surface2);border-radius:4px 4px 0 0}
.tapa:hover .hoja{border-color:var(--c,var(--accent))}
.tapa b{font-size:14px;line-height:1.25}
.tapa small{color:var(--muted);font-size:12px}
.pen-btn{border:1px solid var(--line);background:var(--surface2);color:var(--player-ink);height:38px;padding:0 12px;border-radius:9px;font:700 13px var(--font);cursor:pointer}
body.con-panel .pen-btn{background:var(--accent);color:#000;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface3);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:88%;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.needle{position:relative;height:14px;border-radius:7px;background:var(--surface3);margin:10px 0}
.needle i{position:absolute;top:-4px;width:6px;height:22px;border-radius:3px;background:var(--faint);left:50%;transform:translateX(-50%);transition:left .12s,background .12s}
.needle::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--green);opacity:.6}
.strs{display:flex;gap:6px;flex-wrap:wrap}
.strs button{flex:1;min-width:56px}
.ladder{display:flex;gap:3px;margin-top:12px}
.ladder i{flex:1;height:9px;border-radius:3px}
.chart{display:flex;gap:6px;align-items:flex-end;height:96px}
.chart>div{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.chart i{display:block;height:70px;border-radius:5px;background:var(--surface3);position:relative;overflow:hidden;margin-bottom:3px}
.chart b{position:absolute;bottom:0;left:0;right:0;border-radius:5px}
.big{font:800 60px/1 var(--mono);text-align:center;letter-spacing:-.04em}
/* ---------- reproductor (pantalla completa, 2 columnas en horizontal) ---------- */
#player{position:fixed;inset:0;z-index:40;background:var(--player);color:var(--player-ink);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#player .in{max-width:1280px;margin:0 auto}
#player .pc{background:var(--player-card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px}
#player .cap,#player .sub{color:var(--player-muted)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:start;margin-top:12px}
@media (max-width:860px){.pgrid{grid-template-columns:1fr}}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptitle{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.x{border:1px solid var(--line);background:var(--surface2);color:var(--player-ink);width:38px;height:38px;border-radius:9px;font-size:17px;cursor:pointer}
.mini{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.rb{border:1px solid var(--line);background:var(--surface2);color:var(--player-ink);width:44px;height:44px;border-radius:10px;font-size:22px;cursor:pointer}
.dots{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--surface3);transition:background .05s}
.dots i.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.dots i.ac.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.cues{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.cues>div{padding:8px 10px;border-radius:10px;border:2px solid transparent;text-align:center;opacity:.5;min-width:84px;background:var(--surface2)}
.cues>div.on{border-color:var(--accent);opacity:1}
.cues b{display:block;font:700 14px var(--mono)}
.pat{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pat span{min-width:30px;height:36px;display:grid;place-items:center;border-radius:7px;background:var(--surface3);font:700 16px var(--mono)}
.pat span.on{background:var(--accent);color:#000}
.pat span.rest{opacity:.35}
ol.steps{margin:8px 0 0;padding-left:20px}
ol.steps li{margin:7px 0}
.tip{font-size:14px;color:var(--player-muted);border-left:3px solid var(--cyan);padding-left:10px;margin-top:12px}
.rate{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.rate button{border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:700 15px var(--font);text-align:left;cursor:pointer;color:var(--player-ink);background:var(--surface2)}
.rate button small{display:block;font-weight:400;color:var(--player-muted);font-size:12.5px;margin-top:2px}
.good{display:flex;gap:6px;align-items:center;margin-top:6px}
.good i{width:12px;height:12px;border-radius:50%;background:var(--surface3);border:1px solid var(--player-muted)}
.good i.on{background:var(--cyan);border-color:var(--cyan)}
svg.pat-svg{width:100%;max-width:340px;display:block;margin:4px auto;color:var(--ink)}
.crit{border-top:1px solid var(--line);padding:12px 0}
.crit:first-child{border-top:0}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.r3 button{border:1px solid var(--line);background:var(--surface2);color:var(--player-muted);border-radius:8px;padding:9px 4px;font:700 13px var(--font);cursor:pointer}
.r3 button.on0{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.r3 button.on1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.r3 button.on2{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qopts button{border:1px solid var(--line);background:var(--surface2);color:var(--player-ink);border-radius:10px;padding:16px 10px;font:700 17px var(--font);cursor:pointer}
.qopts button.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.qopts button.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.ring{width:150px;height:150px;margin:0 auto;display:block}
.fix{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.fix b{color:var(--c,var(--accent))}
</style>

 Bm:{f:[-1,2,4,4,3,2],n:[0,1,3,4,2,1],b:[2,1,5]}, G7:{f:[3,2,0,0,0,1],n:[3,2,0,0,0,1]}, D7:{f:[-1,-1,0,2,1,2],n:[0,0,0,2,1,3]},
 E7:{f:[0,2,0,1,0,0],n:[0,2,0,1,0,0]}, A7:{f:[-1,0,2,0,2,0],n:[0,0,2,0,3,0]}, Am7:{f:[-1,0,2,0,1,0],n:[0,0,2,0,1,0]},
 Cmaj7:{f:[-1,3,2,0,0,0],n:[0,3,2,0,0,0]}, Dm7:{f:[-1,-1,0,2,1,1],n:[0,0,0,2,1,1],b:[1,4,5]}, Em7:{f:[0,2,0,0,0,0],n:[0,2,0,0,0,0]},
 E5:{f:[0,2,2,-1,-1,-1],n:[0,1,2,0,0,0]}, A5:{f:[-1,0,2,2,-1,-1],n:[0,0,1,2,0,0]}, G5:{f:[3,5,5,-1,-1,-1],n:[1,3,4,0,0,0]}, D5:{f:[-1,5,7,7,-1,-1],n:[0,1,3,4,0,0]}
};

 pent2:{l:'Pentatónica Am · pos. 2',base:7,root:9,fr:[[8,10],[7,10],[7,10],[7,9],[8,10],[8,10]]},

};
const alt=n=>Array.from({length:n},(_,i)=>i%2?'U':'D');
/* ---- Práctica diaria (rutina original) ---- */
const SK={
 warm:{n:'Calentamiento',e:'🔥'}, dedos:{n:'Gimnasio de dedos',e:'🖐️'}, tec:{n:'Técnica',e:'🎯'}, chords:{n:'Cambios de acordes',e:'🎼'},
 rhythm:{n:'Ritmo',e:'🥁'}, scales:{n:'Escalas y oído',e:'🎹'}, song:{n:'Canción',e:'🎵'}, free:{n:'Improvisación',e:'✨'}

const CHST=['Pon el metrónomo y cambia de acorde cada 4 clics (1 compás).','Toca el acorde una vez, déjalo sonar y mira el siguiente ANTES de moverte.','Mueve todos los dedos a la vez, no de a uno. Usa dedos comunes como ancla.','Revisa cuerda por cuerda: ninguna muerta ni apagada. Limpio primero, rápido después.'];
const LV={
 warm:[
  {n:'Spider 1-2-3-4',b:[50,80,5],st:['Calienta: estira muñecas y dedos 20 segundos por mano (brazo estirado, palma arriba, con la otra mano jala suave los dedos hacia ti). No debe doler.','Ubícate: la 6ª cuerda es la más gruesa. Pon el índice (dedo 1) en el traste 5, el medio (2) en el 6, el anular (3) en el 7 y el meñique (4) en el 8: un dedo por traste, sin saltarte ninguno.','Toca UNA nota por clic: clic → dedo 1 (traste 5), clic → dedo 2 (traste 6), clic → dedo 3 (traste 7), clic → dedo 4 (traste 8). Así, 4 clics = 1 compás.','Al llegar al 8, devuélvete 8-7-6-5. Luego pasa a la 5ª cuerda y repite todo, hasta la 1ª cuerda y de vuelta.','Postura: dedos curvos como una garra suave, la punta del dedo cae justo detrás del traste (no encima del metal), pulgar detrás del mástil, no asomando por arriba.'],tip:'El meñique cae de punta, no de lado. Si se te dobla, baja 10 bpm.'},
  {n:'Spider 1-3-2-4',b:[50,80,5],st:['Mismo recorrido pero en este orden: 1-3-2-4 (trastes 5-7-6-8).','Después prueba 1-2-4-3 y 1-4-2-3.','Cada dedo toca solo cuando le toca: los demás se quedan relajados, sin apretar.'],tip:'Esto es lo que independiza al anular y al meñique: hazlo lento y exacto.'},
  {n:'Spider completo en 6 cuerdas',b:[60,100,10],st:['Haz el spider 1-2-3-4 en la 6ª cuerda y baja a la siguiente al terminar, hasta la 1ª.','Sube de nuevo por las cuerdas, ahora con el orden 1-3-2-4.','Mantén la mano quieta: solo se mueven los dedos.'],tip:'Aquí ya estás listo para pasar a ejercicios con púa. Mantén esto como rutina de arranque.'}
 ],
 tec:[
  {n:'Púa alternada en cuerda al aire',b:[60,110,5],sub:2,pat:alt(8),st:['Toma la púa entre el pulgar y el costado del índice, dejando asomar unos 3 mm de punta.','«Al aire» significa SIN apretar ningún traste: solo tocas la cuerda suelta. Empieza con la 2ª cuerda.','El metrónomo suena 1 clic por tiempo, pero tú tocas DOS notas por clic. Cuenta «1 y 2 y 3 y 4 y»: en cada número (cuando suena el clic) baja la púa ↓; en cada «y» (entre dos clics) súbela ↑. Resultado: ↓↑ ↓↑ ↓↑ ↓↑ = 8 notas por compás.','Muñeca suelta y movimiento pequeño, como sacudir una gota de agua; el antebrazo casi no se mueve.','Cada compás (4 clics) cambia de cuerda: 4 clics en la 2ª, 4 en la 3ª, 4 en la 4ª y de vuelta. Si te pierdes, para y empieza otra vez desde el clic más fuerte (el «1»).'],tip:'Si el antebrazo se pone duro, baja 10 bpm. Tensión = velocidad perdida.'},
  {n:'Cromático 1-2-3-4 con púa',b:[60,100,5],sub:2,pat:alt(8),st:['Es el mismo 1-2-3-4 del Spider (dedos 1-2-3-4 en los trastes 5-6-7-8) pero ahora con púa y en la 3ª cuerda.','Dos notas por clic, y la púa alterna siempre ↓ ↑ ↓ ↑. Ejemplo: dedo 1 (traste 5) con ↓, dedo 2 (traste 6) con ↑, dedo 3 (traste 7) con ↓, dedo 4 (traste 8) con ↑. Esas 4 notas ocupan 2 clics.','Al llegar al 8 vuelve 8-7-6-5. Una ida y vuelta completa son 8 notas = 4 clics = 1 compás. Luego repite en la 2ª cuerda.','Foco en el meñique: que baje de punta y no se levante más de 1 cm. Revisa que la 4ª nota suene igual de fuerte que las otras.'],tip:'Si una nota zumba, estás lejos del traste: apoya el dedo justo antes del metal.'},
  {n:'Cromático en las 6 cuerdas',b:[60,110,5],sub:2,pat:alt(8),st:['Haz el 1-2-3-4 en la 6ª cuerda y pasa a la 5ª sin parar; llega a la 1ª y vuelve.','Cuida el cambio de cuerda: la púa baja y sube sin cortar el ritmo.','Mira solo la mano izquierda cuando necesites; tu oído guía la derecha.'],tip:'Sube de a 5 bpm solo si no se te cae ninguna nota.'},
  {n:'Legato: hammer-on y pull-off',b:[50,90,5],sub:1,st:['Legato significa «unido»: casi todas las notas suenan SIN picarlas con la púa; las hacen los dedos de la mano izquierda.','Hammer-on (martillar): pica con la púa el traste 5 con el dedo 1. Sin volver a picar, deja caer el dedo 2 con fuerza sobre el traste 6, como un martillo: suena una nota nueva. Haz lo mismo con el dedo 3 (traste 7) y el 4 (traste 8).','Pull-off (tirar): con los 4 dedos abajo, suelta el dedo 4 jalando la cuerda un poquito hacia abajo, como un pellizco: suena el traste 7. Haz lo mismo con el 3 (suena el 6) y el 2 (suena el 5).','Ritmo: una nota por clic. Ejemplo en 4 clics: picada (5) → martillazo (6) → martillazo (7) → martillazo (8). En el siguiente compás vuelves con pull-offs.','Golpes firmes con la punta del dedo: que todas suenen igual de fuerte. Si suenan flojas, martilla más fuerte y más cerca del traste.'],tip:'Aquí se fortalece el meñique de verdad. 3 minutos limpios valen más que 10 a la fuerza.'},
  {n:'Patrón 1-3-2-4 con cambio de cuerda',b:[60,110,5],sub:2,pat:alt(8),st:['En la 4ª cuerda, trastes 5-7-6-8 con ↓↑↓↑.','Repite en cada cuerda subiendo y bajando.','Luego mueve la posición un traste hacia arriba y vuelve a empezar.'],tip:'Un patrón nuevo cada semana mantiene el cerebro trabajando, no solo los dedos.'},
  {n:'Semicorcheas ↓↑↓↑ (4 por clic)',b:[50,90,5],sub:4,pat:alt(16),st:['Semicorchea = una nota muy corta. Aquí tocas CUATRO notas por cada clic: ↓↑↓↑ (bajar, subir, bajar, subir).','Cuenta «1-e-y-a 2-e-y-a 3-e-y-a 4-e-y-a»: el clic cae en cada número y las otras tres notas llenan el espacio hasta el siguiente clic. Son 16 notas por compás.','Empieza con una cuerda al aire (sin apretar trastes). Cuando salga parejo y sin tensión, hazlo en el cromático 5-6-7-8.','Si te trabas o sientes tensión, baja 10 bpm. A 50 bpm parece lento, pero son 200 notas por minuto.'],tip:'Esto es velocidad avanzada: el control importa más que el número.'}
 ],
 chords:[
  {n:'Mi menor ↔ La menor',b:[40,80,10],cue:['Em','Am'],st:CHST,tip:'Del Em al Am, los dedos 2 y 3 saltan una cuerda juntos: muévelos como un bloque.'},
  {n:'La menor ↔ Do',b:[40,80,10],cue:['Am','C'],st:CHST,tip:'El dedo 1 se queda en la 2ª cuerda, traste 1: es tu ancla.'},
  {n:'Sol ↔ Do',b:[40,80,10],cue:['G','C'],st:CHST,tip:'Los dedos 1 y 2 "caminan" juntos entre acordes.'},
  {n:'Sol ↔ Re',b:[40,80,10],cue:['G','D'],st:CHST,tip:'El dedo 3 queda cerca de su sitio al cambiar: ahorra movimiento.'},
  {n:'Sol – Mi menor – Do – Re',b:[40,80,10],cue:['G','Em','C','D'],st:CHST,tip:'La progresión más usada del pop: miles de canciones. Ya puedes acompañar muchas.'},
  {n:'La – Re – Mi',b:[40,80,10],cue:['A','D','E'],st:CHST,tip:'Los tres acordes del blues y del rock clásico.'},
  {n:'Re menor ↔ Fa (mini)',b:[40,80,10],cue:['Dm','Fmini'],st:CHST,tip:'El Fa mini usa solo 4 cuerdas: el dedo 1 aplasta dos cuerdas a la vez.'},
  {n:'Fa con cejilla ↔ Do',b:[40,80,10],cue:['F','C'],st:CHST,tip:'La cejilla se hace con el costado del índice, cerca del traste, sin apretar con todo el brazo.'},
  {n:'Si menor ↔ La',b:[40,80,10],cue:['Bm','A'],st:CHST,tip:'Si no suena limpio, sube el pulgar un poco y gira la muñeca hacia afuera.'},
  {n:'Acordes con séptima',b:[40,80,10],cue:['Am7','D7','G7','Cmaj7'],st:CHST,tip:'Desde aquí tus acordes suenan a jazz, soul y bossa.'}
 ],
 rhythm:[
  {n:'Negras abajo (↓ ↓ ↓ ↓)',b:[60,110,10],sub:2,pat:['D','','D','','D','','D',''],cue:['Em'],st:['Arma Mi menor: dedo 2 en la 5ª cuerda traste 2, dedo 3 en la 4ª cuerda traste 2; las demás cuerdas van sueltas.','Rasguea hacia abajo ↓ con la púa o el pulgar, pasando por las 6 cuerdas, justo cuando suena cada clic. Ejemplo: clic ↓ · clic ↓ · clic ↓ · clic ↓ = 4 rasgueos por compás.','Entre clics la mano sube sin tocar las cuerdas: sube y baja siempre, aunque solo toques las bajadas. Así mantienes el pulso.','Muñeca suelta, como sacudiendo agua de la mano; las 6 cuerdas parejas y sin tensar el hombro.'],tip:'Sin ritmo no hay música: esto es lo más importante que practicarás.'},
  {n:'Corcheas continuas (↓↑↓↑)',b:[60,100,10],sub:2,pat:alt(8),cue:['Em','Am'],st:['Corchea = media parte de un tiempo: 2 rasgueos por clic, uno hacia abajo ↓ (en el clic) y uno hacia arriba ↑ (entre clics).','Cuenta «1 y 2 y 3 y 4 y» y rasguea ↓ en los números y ↑ en las «y». La mano nunca para: baja y sube todo el tiempo.','Las bajadas ↓ van un poco más fuertes (las 6 cuerdas); las subidas ↑ suaves y solo en las 3 o 4 cuerdas más delgadas.','Cambia de acorde cada compás (4 clics): 4 clics en Em, 4 clics en Am, y así.'],tip:'Si la mano se detiene, pierdes el pulso: mantenla "en el aire" siempre.'},
  {n:'Patrón pop ↓ _ ↓↑ _ ↑↓↑',b:[60,100,10],sub:2,pat:['D','','D','U','','U','D','U'],cue:['G','C'],st:['La mano derecha hace siempre ↓↑↓↑ (como en el ejercicio anterior), pero en algunos golpes la mano «falla» a propósito: se mueve sin tocar las cuerdas.','El patrón es: ↓ (clic 1) · hueco · ↓ (clic 2) ↑ (y) · hueco · ↑ (y) ↓ (clic 4) ↑ (y). Cuenta en voz alta «1 · 2 y · y 4 y»: dices todos los tiempos aunque en algunos no toques.','Tócalo despacio con un solo acorde (Sol) hasta que salga sin pensar. Luego cambia de acorde cada compás entre Sol y Do.','Si te pierdes, vuelve a ↓↑ continuo 4 compases y retoma.'],tip:'Si te pierdes, vuelve a ↓↑ continuo 4 compases y retoma.'},
  {n:'Con silencio (↓ _ x ↑ ↓ _ x ↑)',b:[60,100,10],sub:2,pat:['D','','x','U','D','','x','U'],cue:['Am','F'],st:['La «x» es un golpe seco: apoya los dedos de la mano izquierda sobre las cuerdas sin apretar y rasguea: suena un «chk» sin nota.','La mano derecha sigue ↓↑ constante. Ejemplo: ↓ (suena) · hueco · x (chk seco) · ↑ (suena), y repites.','Practica primero solo el golpe seco: apoya y rasguea 4 veces, hasta que suene a percusión y no a cuerdas.','Alterna Am y F cada compás.'],tip:'El silencio es parte del ritmo: da groove.'},
  {n:'Arpegio p-i-m-a',b:[50,90,10],sub:2,pat:['p','i','m','a','m','i','m','a'],cue:['Am','C'],st:['Pulgar (p) en la cuerda grave del acorde, índice (i) 3ª, medio (m) 2ª, anular (a) 1ª.','Dedos sueltos, caen y se quedan casi pegados a la cuerda.','Deja que cada nota suene hasta la siguiente.'],tip:'Sonará despacio al principio: eso es lo normal y lo correcto.'},
  {n:'Travis picking (pulgar alternado)',b:[50,90,10],sub:2,pat:['p','i','p','m','p','i','p','m'],cue:['C','G'],st:['El pulgar alterna entre dos bajos (5ª y 4ª cuerda) como un metrónomo.','Índice y medio tocan cuerdas agudas entre los bajos.','Separa: primero solo el pulgar, luego suma los otros dos.'],tip:'Cuando el pulgar sea automático, ya puedes tocar y cantar a la vez.'}
 ],
 scales:[
  {n:'Pentatónica menor de La · posición 1',b:[50,100,10],sub:2,pat:alt(8),sc:['pent1'],st:['Sube la escala nota por nota (de la 6ª a la 1ª cuerda), dos notas por cuerda, con púa alternada.','Baja por el mismo camino.','Canta (o di) la nota raíz — La — cada vez que la toques: está marcada en naranja.','Mira el diagrama solo al principio; luego de memoria.'],tip:'Cantar la nota antes de tocarla entrena el oído más que cualquier app.'},
  {n:'Pent. pos. 1 en grupos de 3',b:[50,100,10],sub:1,sc:['pent1'],st:['Toca la escala en grupos de 3 notas: 1-2-3, 2-3-4, 3-4-5…','Luego en grupos de 4.','Siempre con metrónomo y púa alternada.'],tip:'Los patrones convierten la escala en frases musicales.'},
  {n:'Escala de Do mayor (posición abierta)',b:[50,100,10],sub:2,pat:alt(8),sc:['cmaj'],st:['Sube de Mi grave a Mi agudo por la escala de Do mayor, nota a nota.','Cuando llegues a una Do (naranja) detente un segundo y cántala.','Baja de vuelta y repite más rápido.'],tip:'Esta escala es la base de toda la teoría: do-re-mi-fa-sol-la-si.'},
  {n:'Pentatónica menor · posición 2',b:[50,100,10],sub:2,pat:alt(8),sc:['pent2'],st:['Misma idea que la posición 1, pero en el traste 7.','Sube y baja con púa alternada.','Conecta con la posición 1: termina una y salta a la otra.'],tip:'Cada posición es la misma escala en otro lugar del mástil.'},
  {n:'Une posición 1 y 2 subiendo',b:[50,100,10],sub:2,pat:alt(8),sc:['pent1','pent2'],st:['Sube por la posición 1 y, en una cuerda, desliza hacia la posición 2.','Baja por la 2 y vuelve a la 1.','Intenta tocar una melodía simple (como "Cumpleaños feliz") sobre las notas de la escala.'],tip:'Aquí empieza el solo: unir posiciones evita quedarte "encajonado".'},
  {n:'Bends y vibrato',b:null,st:['Elige una nota de la pentatónica (traste 7 en la 3ª cuerda) y empújala hacia arriba con el dedo 3 apoyado por el 1 y el 2.','Sube de a medio tono hasta llegar al tono entero y escucha que coincida con la nota siguiente.','Prueba el vibrato: muévela rítmicamente sobre la nota, como un temblor lento.'],tip:'Cuida el cuello y la mano: si duele, para y estira.'}
 ],
 song:[
  {n:'Elige tu canción y aprende la 1ª estrofa',b:null,st:['Elige UNA canción que te guste y tenga acordes que ya conozcas.','Aprende solo la primera estrofa, lenta (50% de la velocidad real).','Toca la estrofa 4 veces seguidas sin parar aunque falle.'],tip:'Escribe el nombre de la canción abajo para recordarla.'},
  {n:'Estrofa + coro sin parar',b:null,st:['Une la estrofa y el coro a velocidad 60-70%.','Si te trabas, no pares: sigue y arregla después.','Aísla el pasaje difícil y repítelo 5 veces limpio.'],tip:'Estudiar por trozos es 3 veces más rápido que repetir todo.'},
  {n:'Canción completa a 70%',b:null,st:['Toca la canción completa a ritmo lento con metrónomo.','Marca dónde fallas con un lápiz y trabaja solo ese compás.','Si puedes, cántala o tararéala mientras tocas.'],tip:'Cuando pierdas menos de 3 veces, estás listo para subir.'},
  {n:'Canción completa a tempo',b:null,st:['Tócala a su velocidad real, con el disco o con metrónomo.','Concéntrate en que no se caiga el ritmo.','Si algo falla, baja a 80% y recompón.'],tip:'Un compás perfecto vale más que una canción entera tropezada.'},
  {n:'Cántala y grábate',b:null,st:['Cántala y tócala a la vez.','Grábate con el celular y escúchala al día siguiente.','Anota 1 cosa que mejorar y 1 que te gustó.'],tip:'Escucharte es el mejor profesor que existe.'}
 ],
 free:[
  {n:'2 notas, muchos ritmos',b:null,st:['Elige solo 2 notas de la pentatónica y toca ritmos distintos sobre el metrónomo.','Usa silencios: un buen solo respira.','Repite una idea que te guste 3 veces seguidas.'],tip:'Menos notas, más música.'},

function buildDedos(){
  const G=[];let sec='';

      st:['Mira el dibujo: cada columna es un dedo (1 = índice en el traste 5, 2 = medio en el 6, 3 = anular en el 7, 4 = meñique en el 8) y los números dicen en qué orden suena cada nota. Ejemplo: «1-3-2-4» significa índice, anular, medio, meñique.',

        pima?'Mano derecha: pulgar-índice-medio-anular (p-i-m-a), un dedo por nota.':'Mano derecha: alterna índice y medio en cada nota (i-m-i-m), sin cambiar su orden aunque cambie el de la izquierda. Ejemplo: nota 1 con i, nota 2 con m, nota 3 con i, nota 4 con m.',
        'Dedos curvos, cerca del traste y pulgar detrás del mástil. Si una nota zumba o suena débil, baja 10 bpm.'],
      tip:o.tip||'Despacio y exacto: cada dedo cae de punta, sin arrastrar a sus vecinos.'});};
  sec='1 · Básico';
  mk('1-2-3-4 en una cuerda','1-2-3-4',{b:[60,100,10],how:'Toca 1-2-3-4 en una sola cuerda, vuelve 4-3-2-1 y cambia de cuerda. Empieza por la 6ª.',tip:'Es tu base: hazlo perfecto antes de pasar a lo siguiente.'});

  mk('1-2-3-4 y 4-3-2-1 en las 6 cuerdas','1-2-3-4',{b:[60,100,10],how:'1-2-3-4 subiendo de cuerda, luego 4-3-2-1 bajando de cuerda, sin parar, de la 6ª a la 1ª y de vuelta.',tip:'Tu rutina actual: este nivel ya la dominas, úsalo de calentamiento.'});
  mk('1-2-3-4 con p-i-m-a','1-2-3-4',{b:[50,90,10],rh:'pima',tip:'Ahora la derecha también trabaja con 4 dedos: es más difícil que i-m.'});
  sec='2 · Permutaciones desde el dedo 1';
  ['1-2-4-3','1-3-2-4','1-3-4-2','1-4-2-3','1-4-3-2'].forEach((o,i)=>mk(o+' (empieza con el 1)',o,{tip:['El 4 va antes que el 3: el meñique se adelanta.','El anular y el medio se cruzan: no muevas la mano, solo los dedos.','Dos dedos exteriores seguidos: busca relajar el antebrazo.','Es de los más difíciles: el 1 y el 4 se separan al máximo.','Termina con el medio: no dejes que el meñique arrastre al anular.'][i]}));
  sec='3 · Permutaciones desde el dedo 4';
  ['4-3-1-2','4-2-3-1','4-2-1-3','4-1-3-2','4-1-2-3'].forEach((o,i)=>mk(o+' (empieza con el 4)',o,{tip:['Empiezas fuerte con el meñique y luego saltas al índice.','El 4 y el 2 se estiran: no levantes demasiado los dedos.','Después del 2 vuelves al 1: cuida que el 3 no arrastre.','El 1 y el 4 se separan: usa toda la mano, no solo los dedos.','Termina con el anular: cuida que no se levante muy lejos del mástil.'][i]}));
  sec='4 · Combinadas';
  ['2-1-4-3','3-4-1-2','2-4-1-3','3-1-4-2'].forEach(o=>mk(o,o,{b:[50,80,10],tip:'Ya no empiezas por un extremo: el cerebro tiene que planear dos pasos adelante.'}));
  sec='5 · Técnicas avanzadas';
  mk('Dos notas por dedo (1-1-2-2-3-3-4-4)','1-1-2-2-3-3-4-4',{seq:[[1,0],[1,0],[2,0],[2,0],[3,0],[3,0],[4,0],[4,0]],b:[50,80,10],how:'Cada dedo toca la misma nota 2 veces seguidas (con la derecha), luego pasa al siguiente.',tip:'Te obliga a soltar y volver a presionar cada dedo con control.'});
  mk('Saltando cuerdas (1-2-3-4)','1-2-3-4 saltando',{seq:[[1,0],[2,2],[3,0],[4,2]],rows:3,b:[50,80,10],how:'Toca el 1 en una cuerda, el 2 dos cuerdas más abajo, el 3 en la primera, el 4 en la de abajo, y así.',tip:'La púa o los dedos de la derecha salen de la cuerda sin tocar la del medio: precisión.'});
  mk('Diagonal 1-2-3-4 subiendo de cuerda','1-2-3-4 en diagonal',{seq:[[1,0],[2,1],[3,2],[4,3]],rows:4,b:[50,80,10],how:'Cada dedo toca en una cuerda distinta: 1 en la 6ª, 2 en la 5ª, 3 en la 4ª, 4 en la 3ª. Sube y baja la diagonal.',tip:'Mueve la muñeca con cada cuerda: la mano acompaña al dedo.'});
  mk('Trinos con el meñique (3-4 y 2-4)','3-4-3-4',{seq:[[3,0],[4,0],[3,0],[4,0],[3,0],[4,0],[3,0],[4,0]],b:[50,80,10],how:'Alterna rápido 3-4-3-4, luego 2-4-2-4 y 1-4-1-4. Solo trabajan esos dos dedos.',tip:'El mejor ejercicio para que el meñique deje de doblarse.'});
  mk('Extensión: dedos 1-2-4 (sin el 3)','1-2-4',{seq:[[1,0],[2,0],[4,0]],b:[50,80,10],how:'Toca 1-2-4 saltándote el 3 (trastes 5-6-8), luego 1-3-4 (trastes 5-7-8). El dedo 4 se estira un traste extra.',tip:'Estira sin dolor: es normal sentir tensión, pero nunca dolor.'});
  mk('Legato 1-2-3-4 (martilla y tira)','1-2-3-4 legato',{b:[50,80,10],sub:1,how:'Pica solo la primera nota (traste 5) y "martilla" 6-7-8 con los dedos 2-3-4. Para bajar, haz pull-off tirando la cuerda hacia abajo.',tip:'Una sola picada por grupo de 4 notas: la fuerza sale de los dedos.'});
  mk('Semicorcheas 1-2-3-4 (4 por clic)','1-2-3-4 rápido',{b:[50,80,10],sub:4,how:'Un patrón completo 1-2-3-4 por cada clic del metrónomo, sin pausas y siempre pareja.',tip:'Aquí manda el control: si se te caen notas, baja el tempo.'});
  mk('Permutaciones sin parar (1-3-2-4 ↔ 4-2-3-1)','1-3-2-4',{b:[50,80,10],how:'Toca 1-3-2-4 subiendo y 4-2-3-1 bajando sin pausa, en las 6 cuerdas. Cambia de cuerda sin perder el clic.',tip:'Control total de las dos manos al mismo tiempo.'});
  mk('🎲 Orden sorpresa','1-2-3-4',{rand:true,b:[50,80,10],how:'Toca el orden que salió en el dado (usa 🎲 para sacar otro). Cada cuerda es un orden nuevo: no repitas.',tip:'La meta final: cualquier orden, a cualquier cuerda, sin pensar.'});
  return G;
}

function L(a,lv,id,n,obj,st,tip,x){LES.push(Object.assign({a,lv,id,n,obj,st,tip},x||{}))}
// Mano izquierda
L('mi',1,'mi1','Postura y presión mínima','Sonar limpio apretando lo justo.',['Siéntate derecho, guitarra apoyada en la pierna y el mástil un poco hacia arriba.','Pisa la 6ª cuerda en el traste 3 con el dedo 2. Pica cada clic y ve soltando presión hasta que zumbe; vuelve a apretar lo mínimo para que suene.','Repite con cada dedo (1, 2, 3 y 4) en las cuerdas 6, 4 y 2.'],'La mayoría aprieta el doble de lo necesario: eso cansa y desafina.',{b:[60,60,5]});
L('mi',1,'mi2','Spider 1-2-3-4','Un dedo por traste, de punta y cerca del metal.',['Trastes 5-6-7-8 con los dedos 1-2-3-4, una nota por clic.','Sube de cuerda al terminar cada grupo y vuelve bajando.','El pulgar queda detrás del dedo medio, no asomado por arriba.'],'El meñique cae de punta, no de lado.',{b:[50,80,5],sub:1});
L('mi',1,'mi3','Primer acorde con todas las cuerdas limpias','Que Em, Am y C suenen sin ninguna cuerda muerta.',['Arma Mi menor y toca cuerda por cuerda, de la 6ª a la 1ª.','Si una cuerda no suena, corrige el ángulo del dedo (más de punta) o acércalo al traste.','Repite con La menor y Do.'],'Revisa cuerda por cuerda siempre: es tu control de calidad.',{cue:['Em','Am','C']});
L('mi',2,'mi4','Permutaciones 1-3-2-4 y 1-4-2-3','Independizar anular y meñique.',['Toca 1-3-2-4 (trastes 5-7-6-8) en las 6 cuerdas, dos notas por clic.','Cambia a 1-4-2-3 al llegar arriba.','Los dedos que no tocan se quedan quietos y cerca de la cuerda.'],'Lento y exacto: la velocidad viene sola.',{b:[60,100,5],sub:2,pat:alt(8)});
L('mi',2,'mi5','Cejilla: de Fa mini a Fa completo','Hacer cejilla sin dolor ni cuerdas muertas.',['Arma Fa mini (4 cuerdas) y tócalo cuerda por cuerda.','Ahora Fa completo: el índice estirado con el costado (no la yema), pegado al traste.','Alterna Fa mini y Fa cada compás.'],'Tira el brazo levemente hacia atrás en vez de apretar con el pulgar: el peso del brazo hace la cejilla.',{b:[40,70,10],cue:['Fmini','F']});
L('mi',2,'mi6','Legato: hammer-on y pull-off','Notas fuertes sin picar con la derecha.',['Pica el traste 5 y martilla 7 con el dedo 3; luego 5-8 con el dedo 4.','Pull-off: desde 7 a 5 tirando la cuerda levemente hacia el suelo.','Combina 5-7-8 subiendo y 8-7-5 bajando con una sola picada.'],'El hammer-on es un golpe rápido de la punta, no una presión lenta.',{b:[50,90,5],sub:2});
L('mi',3,'mi7','Extensiones de 5 trastes','Abrir la mano sin tensión.',['Toca 1-2-4 en los trastes 5-7-9 de la 6ª cuerda (dedo 4 estirado).','Sube por todas las cuerdas y luego baja la posición al traste 3 (más difícil).','Descansa 30 s cada minuto.'],'Estirar sí, dolor no. Si duele, para.',{b:[50,80,5],sub:1});
L('mi',3,'mi8','Cejillas móviles (forma de Mi y de La)','Tocar cualquier acorde mayor o menor con cejilla.',['Fa (forma de Mi, traste 1): súbelo al traste 3 = Sol, traste 5 = La.','Si menor (forma de La menor, traste 2): súbelo al 5 = Re menor, al 7 = Mi menor.','Cambia entre Fa y Si menor cada compás.'],'La nota del bajo (6ª o 5ª cuerda) te dice el nombre del acorde.',{b:[50,80,10],cue:['F','Bm']});
// Mano derecha
L('md',1,'md1','Agarre de púa y ↓ en cuerdas al aire','Atacar cada cuerda con precisión.',['Púa entre el pulgar y el costado del índice, asomando 3 mm.','Toca ↓ en cada clic: 4 veces la 6ª, 4 la 5ª… hasta la 1ª.','Apoya suavemente el meñique en la tapa si te ayuda a orientarte.'],'Agarra la púa como una llave: firme pero sin apretar.',{b:[60,100,10],sub:1,pat:['D','D','D','D']});
L('md',1,'md2','Púa alternada ↓↑','Alternar sin pensar.',['2ª cuerda al aire, ↓↑ dos notas por clic.','Muñeca suelta, movimiento pequeño.','Cada compás cambia de cuerda.'],'Si el antebrazo se endurece, baja 10 bpm.',{b:[60,110,5],sub:2,pat:alt(8)});
L('md',2,'md3','Cambios de cuerda con alternada','Pasar de cuerda sin romper el ↓↑.',['Toca 2 notas por cuerda (trastes 5 y 7) subiendo de la 6ª a la 1ª.','Fíjate: unas veces cambias de cuerda "por fuera" y otras "por dentro".','Si un tipo de cambio cuesta más, repítelo aislado 1 minuto.'],'Los cambios por dentro son los más difíciles: es normal.',{b:[60,100,5],sub:2,pat:alt(8)});
L('md',2,'md4','Palm mute (apagado con la palma)','El sonido "chug" del rock.',['Apoya el canto de la mano derecha sobre las cuerdas, justo encima del puente.','Toca ↓ en la 6ª cuerda en corcheas: debe sonar corto y grave, no ahogado del todo.','Alterna 4 golpes con mute y 4 sin mute.'],'Si suena demasiado apagado, mueve la palma hacia el puente.',{b:[70,120,10],sub:2,pat:['D','D','D','D','D','D','D','D']});
L('md',2,'md5','Saltos de cuerda','Saltar una cuerda sin tocarla.',['Alterna 6ª y 4ª cuerda al aire con ↓↑.','Luego 5ª-3ª, 4ª-2ª y 3ª-1ª.','La púa pasa por encima de la cuerda del medio.'],'Movimiento en arco, no en línea recta.',{b:[50,90,5],sub:2,pat:alt(8)});
L('md',3,'md6','Semicorcheas a tempo','4 notas por clic, parejas.',['Cuerda al aire: ↓↑↓↑ por cada clic.','Luego el cromático 5-6-7-8 en semicorcheas.','Acentúa la primera de cada grupo.'],'Control antes que velocidad.',{b:[50,100,5],sub:4,pat:alt(16)});
L('md',3,'md7','Barrido (sweep) en 3 cuerdas','Tocar arpegios rápidos con un solo movimiento.',['Arpegio de La menor: traste 7 en la 3ª, 5 en la 2ª, 5 en la 1ª.','Un solo movimiento ↓ que "cae" por las 3 cuerdas; vuelve ↑.','Levanta cada dedo apenas suena para que las notas no se mezclen.'],'Es un movimiento, no 3 golpes separados.',{b:[50,90,5],sub:2});
// Cambios de acordes
L('cambios',1,'c1','Mi menor ↔ La menor','Mover dos dedos en bloque.',CHST,'Los dedos 2 y 3 saltan juntos una cuerda.',{b:[40,80,10],cue:['Em','Am']});
L('cambios',1,'c2','Sol ↔ Do ↔ Re','Los tres acordes más usados.',CHST,'En Sol→Do los dedos 1 y 2 caminan juntos.',{b:[40,80,10],cue:['G','C','D']});
L('cambios',1,'c3','Cambios en un minuto','Medir y mejorar tu velocidad de cambio.',['Elige un par (por ejemplo Am-C). Pon el cronómetro: cuenta cuántos cambios limpios haces en 60 s.','Anota el número.','Repite 3 días: la meta es sumar 5 cambios cada día.'],'Lo que se mide, mejora.',{cue:['Am','C']});
L('cambios',2,'c4','Sol – Mi menor – Do – Re','La progresión del pop.',CHST,'Miles de canciones usan estos 4 acordes.',{b:[50,90,10],cue:['G','Em','C','D']});
L('cambios',2,'c5','La menor – Fa – Do – Sol','Incluir la cejilla mini en una progresión.',CHST,'De Am a Fa mini el dedo 1 pasa de pisar 1 cuerda a 2.',{b:[50,90,10],cue:['Am','Fmini','C','G']});
L('cambios',2,'c6','Dos acordes por compás','Cambiar cada 2 clics.',['Rasguea ↓ en cada clic y cambia cada 2 clics.','Do-Sol-La menor-Fa mini.','Anticipa: en el 2º clic ya estás viajando.'],'Esto es lo que te deja tocar la mayoría de canciones reales.',{b:[50,90,10],cue:['C','G','Am','Fmini']});
L('cambios',3,'c7','Cejillas: Fa – Si menor – Do','Cambiar a y desde cejillas sin perder el pulso.',CHST,'Prepara la cejilla antes con la forma de la mano en el aire.',{b:[50,90,10],cue:['F','Bm','C']});
L('cambios',3,'c8','Cadenas de séptimas','Acordes de jazz y bossa.',CHST,'Dm7 – G7 – Cmaj7 es el ii-V-I: la progresión del jazz.',{b:[50,90,10],cue:['Dm7','G7','Cmaj7','Am7']});
// Rasgueos
L('rasgueo',1,'r1','Negras hacia abajo','Pulso firme con ↓.',['Con Mi menor, ↓ en cada clic.','Muñeca suelta, como sacudiendo agua.','Las 6 cuerdas parejas.'],'Sin pulso no hay música.',{b:[60,110,10],sub:2,pat:['D','','D','','D','','D',''],cue:['Em']});
L('rasgueo',1,'r2','Corcheas continuas ↓↑','La mano que nunca para.',['↓ en el clic, ↑ entre clics.','Acentúa las bajadas.','Cambia Em-Am cada compás.'],'Mano en el aire siempre.',{b:[60,100,10],sub:2,pat:alt(8),cue:['Em','Am']});
L('rasgueo',2,'r3','Patrón pop ↓ _ ↓↑ _ ↑↓↑','El rasgueo de mil canciones.',['La mano sigue ↓↑ siempre y "falla" en los huecos.','Cuenta 1 · 2 y · y 4 y.','Cambia Sol-Do cada compás.'],'Si te pierdes, vuelve a ↓↑ continuo.',{b:[60,100,10],sub:2,pat:['D','','D','U','','U','D','U'],cue:['G','C']});
L('rasgueo',2,'r4','Chasquido (mute) en el 2 y el 4','Groove de funk y reggae.',['La "x" es un golpe con las cuerdas apagadas por la mano izquierda.','Patrón ↓ _ x ↑ ↓ _ x ↑.','Alterna Am y Fa mini.'],'El chasquido hace de "caja" de batería.',{b:[60,100,10],sub:2,pat:['D','','x','U','D','','x','U'],cue:['Am','Fmini']});
L('rasgueo',2,'r5','Bajo + rasgueo','Separar el bajo del acorde.',['"p" = toca solo la cuerda del bajo; luego ↓↑ en las agudas.','Patrón: bajo _ ↓↑ bajo _ ↓↑.','Con Do (bajo 5ª) y Sol (bajo 6ª).'],'El bajo marca el tiempo fuerte.',{b:[60,100,10],sub:2,pat:['p','','D','U','p','','D','U'],cue:['C','G']});
L('rasgueo',3,'r6','Semicorcheas funk','Rasgueo continuo de 16 con acentos.',['↓↑↓↑ por clic, casi todo muteado.','Deja sonar solo el golpe del 2 y el 4.','Con Mi7.'],'La mano derecha es la batería; la izquierda decide qué suena.',{b:[60,100,5],sub:4,pat:['x','x','x','x','D','x','x','x','x','x','x','x','D','x','x','x'],cue:['E7']});
L('rasgueo',3,'r7','Ritmo en 6/8 (balada y cueca)','Sentir 2 grupos de 3.',['Cada clic tiene 3 golpes: ↓ ↓↑ (cuenta "1-2-3, 4-5-6").','Acentúa el 1 y el 4.','Con La menor y Mi.'],'El 6/8 se siente en 2, no en 6.',{b:[50,80,5],sub:3,pat:['D','','U','D','','U'],cue:['Am','E']});
L('rasgueo',3,'r8','Shuffle de blues','Ritmo de tresillos con swing.',['Bajo en la 6ª/5ª cuerda: alterna traste 2 y 4 con swing ("laaa-ga laaa-ga").','Sigue el blues: La (4 compases), Re (2), La (2), Mi, Re, La, Mi.','Usa palm mute ligero.'],'El swing es un tresillo con el del medio en silencio.',{b:[60,100,5],sub:3,pat:['D','','D','D','','D'],cue:['A','D','E']});
// Punteo
L('punteo',1,'p1','Escala de Do mayor abierta','Tus primeras melodías.',['Sube nota a nota de Mi grave a Mi agudo.','Para en cada Do (naranja) y cántala.','Toca "Cumpleaños feliz" buscando las notas.'],'Do-re-mi-fa-sol-la-si: la base de todo.',{b:[50,100,10],sub:2,pat:alt(8),sc:['cmaj']});
L('punteo',1,'p2','Pentatónica menor de La · pos. 1','La escala del rock y el blues.',['Sube y baja dos notas por cuerda con púa alternada.','Di "La" cada vez que tocas la raíz.','Luego de memoria.'],'El 80% de los solos de rock salen de aquí.',{b:[50,100,10],sub:2,pat:alt(8),sc:['pent1']});
L('punteo',2,'p3','Secuencias de 3 y 4 notas','Convertir la escala en frases.',['Grupos de 3: 1-2-3, 2-3-4, 3-4-5…','Grupos de 4: 1-2-3-4, 2-3-4-5…','Siempre con metrónomo.'],'Las secuencias dan vocabulario para improvisar.',{b:[60,110,5],sub:2,pat:alt(8),sc:['pent1']});
L('punteo',2,'p4','Bends y vibrato','Que la guitarra "cante".',['Bend de 1 tono en el traste 7 de la 3ª cuerda (dedo 3 ayudado por 1 y 2).','Compara con la nota del traste 9: debe sonar igual.','Vibrato: oscila la nota de forma pareja y lenta.'],'Un bend desafinado se nota más que una nota equivocada.',{sc:['pent1']});
L('punteo',2,'p5','Escala de blues','Agregar la "nota triste".',['Es la pentatónica + una nota (traste 6 en la 5ª y 8 en la 3ª).','Úsala de paso, no te quedes en ella.','Improvisa sobre un La.'],'Esa nota de paso es el sabor del blues.',{b:[60,100,5],sub:2,pat:alt(8),sc:['blues']});
L('punteo',3,'p6','Conectar posiciones 1 y 2','Moverte por el mástil.',['Sube por la pos. 1 y desliza a la pos. 2 en la 3ª cuerda.','Baja por la 2 y vuelve.','Improvisa usando las dos.'],'Así dejas de estar "encajonado".',{b:[60,110,5],sub:2,pat:alt(8),sc:['pent1','pent2']});
L('punteo',3,'p7','Escala mayor de Sol (forma de 6ª cuerda)','Escala completa movible.',['Sube y baja la escala en el traste 2.','Muévela al traste 4 = La mayor.','Toca en terceras: 1-3, 2-4, 3-5…'],'Esta forma sirve en todas las tonalidades.',{b:[60,110,5],sub:2,pat:alt(8),sc:['gmaj']});
L('punteo',3,'p8','Solo sobre blues de 12 compases','Improvisar siguiendo los acordes.',['Graba o imagina el blues en La: La-La-La-La / Re-Re-La-La / Mi-Re-La-Mi.','Toca frases de 2 compases con la escala de blues.','En cada cambio de acorde, apunta a una nota del acorde nuevo.'],'Escuchar los cambios es lo que separa al solista del que "toca escalas".',{sc:['blues'],cue:['A7','D7','E7']});
// Arpegios
L('arpegio',1,'a1','El pulgar en los bajos','Encontrar el bajo de cada acorde.',['Am y C: el bajo está en la 5ª cuerda; G y E en la 6ª; D en la 4ª.','Toca solo el bajo con el pulgar en cada clic.','Cambia de acorde cada compás.'],'El pulgar es el bajista de tu banda.',{b:[60,100,10],sub:1,pat:['p','p','p','p'],cue:['Am','C','G','D']});
L('arpegio',1,'a2','Arpegio p-i-m-a','Un dedo por cuerda.',['p bajo, i 3ª, m 2ª, a 1ª.','Dedos sueltos y cerca de su cuerda.','Deja sonar las notas.'],'Despacio es lo correcto.',{b:[50,90,10],sub:2,pat:['p','i','m','a','m','i','m','a'],cue:['Am','C']});
L('arpegio',2,'a3','p-i-m-a-m-i en 3/4','Arpegio de vals.',['6 notas por compás: p-i-m-a-m-i.','Cuenta en 3 (2 notas por clic).','Am, Mi, Am, Mi.'],'Las baladas más lindas viven aquí.',{b:[50,90,10],sub:2,pat:['p','i','m','a','m','i'],cue:['Am','E']});
L('arpegio',2,'a4','Travis picking','Pulgar alternado + dedos.',['El pulgar alterna dos bajos sin parar.','i y m tocan entre bajos.','Primero solo el pulgar.'],'Cuando el pulgar es automático, ya puedes cantar.',{b:[50,90,10],sub:2,pat:['p','i','p','m','p','i','p','m'],cue:['C','G']});
L('arpegio',2,'a5','Arpegios con púa','Acordes cuerda por cuerda dejando sonar.',['Con púa: bajo, 3ª, 2ª, 1ª, 2ª, 3ª.','Mantén el acorde pisado completo.','Am – Fa mini – Do – Sol.'],'Sonido de balada rock.',{b:[60,100,10],sub:2,pat:['D','D','D','U','U','U','D','U'],cue:['Am','Fmini','C','G']});
L('arpegio',3,'a6','Melodía + bajo (fingerstyle)','Tocar melodía y acompañamiento a la vez.',['El pulgar toca el bajo en cada clic.','Los dedos tocan una melodía simple en la 1ª y 2ª cuerda (por ejemplo la escala de Do).','Empieza con 1 nota de melodía por compás y ve sumando.'],'Piensa en dos guitarristas: uno de bajo y otro de melodía.',{b:[50,80,5],sub:1,cue:['C','G']});
L('arpegio',3,'a7','Tríadas en las 3 cuerdas agudas','Acordes pequeños por todo el mástil.',['Do mayor en 1ª-2ª-3ª: trastes 8-8-9, luego 12-13-12.','Arpegia cada forma p-i-m y sube por el mástil.','Haz lo mismo con La menor.'],'Las tríadas son el secreto de los guitarristas de funk y pop.',{b:[50,90,5],sub:2});
// Ritmo
L('ritmo',1,'t1','Tocar en el clic','Que el clic desaparezca bajo tu nota.',['Cuerdas apagadas con la mano izquierda: golpe ↓ en cada clic.','Escucha: si oyes el clic aparte, te corriste.','Prueba a 60, 80 y 100 bpm.'],'El tempo lento es más difícil de lo que parece.',{b:[60,120,10],sub:1,pat:['x','x','x','x']});
L('ritmo',1,'t2','Contar 1 y 2 y','Corcheas en voz alta.',['Cuenta "1 y 2 y 3 y 4 y" mientras tocas ↓↑.','Acentúa los números.','Luego solo toca los números y canta los "y".'],'Contar en voz alta se siente tonto, y funciona.',{b:[60,100,10],sub:2,pat:alt(8)});
L('ritmo',2,'t3','Tresillos','3 notas por clic, parejas.',['Cuenta "1-trip-let 2-trip-let".','Cuerdas apagadas: ↓↑↓ por clic.','Alterna 2 compases de corcheas y 2 de tresillos.'],'El cambio de subdivisión es lo que entrena el reloj interno.',{b:[50,90,5],sub:3,pat:['D','U','D','U','D','U']});
L('ritmo',2,'t4','Contratiempos (solo los "y")','Tocar entre los clics.',['La mano sigue ↓↑ pero solo toca las subidas.','Cuenta los números en voz alta.','Con Em.'],'El reggae y el ska viven en el contratiempo.',{b:[60,100,10],sub:2,pat:['','U','','U','','U','','U'],cue:['Em']});
L('ritmo',2,'t5','Metrónomo en 2 y 4','Groove con backbeat.',['Pon el metrónomo a la mitad (por ejemplo 45) y siente cada clic como el 2 y el 4.','Toca corcheas sintiendo el 1 y el 3 tú solo.','Así se siente una batería.'],'Los músicos de jazz y funk practican así.',{b:[40,60,5],sub:2,pat:alt(8)});
L('ritmo',3,'t6','Semicorcheas con silencios','Patrones de 16 precisos.',['Cuerdas apagadas, ↓↑↓↑ por clic.','Toca solo la 1ª y 4ª de cada grupo (como "1 . . a").','Luego solo la 2ª y 3ª.'],'Es el lenguaje del funk.',{b:[50,90,5],sub:4,pat:['D','','','U','D','','','U','D','','','U','D','','','U']});
L('ritmo',3,'t7','Tiempo interno','Mantener el tempo sin metrónomo.',['Toca 4 compases con metrónomo.','Baja el volumen y toca 4 compases solo; vuelve a subir: ¿seguías a tiempo?','Ve alargando el silencio a 8 compases.'],'Tu reloj interno es lo que te deja tocar con otros.',{b:[70,100,5],sub:2,pat:alt(8)});
// Teoría
L('teoria',1,'th1','Las cuerdas y las notas naturales','Saber cómo se llaman las cuerdas y las primeras notas.',['Las cuerdas al aire, de la 6ª (grave) a la 1ª: Mi – La – Re – Sol – Si – Mi.','Cada traste sube medio tono. Entre Mi-Fa y Si-Do hay medio tono; entre las demás, un tono (2 trastes).','Responde el quiz.'],'Truco: "Mi Abuela Dice Gracias Bien Educada" (E-A-D-G-B-E).',{quiz:{t:['notes'],n:8,o:{f:3,nat:true}},learn:'Las notas son Do, Re, Mi, Fa, Sol, La, Si. Entre Mi y Fa, y entre Si y Do hay solo medio tono (1 traste); entre las demás hay un tono (2 trastes). Las notas con # (sostenido) están entre medio.'});
L('teoria',1,'th2','Notas en la 6ª y 5ª cuerda','Ubicar el bajo de cualquier acorde con cejilla.',['La 6ª cuerda empieza en Mi: Mi(0) Fa(1) Sol(3) La(5) Si(7) Do(8) Re(10) Mi(12).','La 5ª empieza en La: La(0) Si(2) Do(3) Re(5) Mi(7) Fa(8) Sol(10) La(12).','Responde el quiz.'],'En el traste 12 todo se repite una octava arriba.',{quiz:{t:['notes'],n:10,o:{s:[6,5],f:12}},learn:'Saber las notas de la 6ª y 5ª cuerda te permite tocar cualquier acorde con cejilla: la nota del bajo es el nombre del acorde.'});
L('teoria',2,'th3','Intervalos','Medir la distancia entre dos notas.',['Un intervalo se mide en semitonos (trastes).','3ª menor = 3, 3ª mayor = 4, 5ª justa = 7, octava = 12.','Responde el quiz.'],'Los intervalos son las "piezas de Lego" de acordes y escalas.',{quiz:{t:['int'],n:10},learn:'2ª menor 1 · 2ª mayor 2 · 3ª menor 3 · 3ª mayor 4 · 4ª justa 5 · 5ª justa 7 · 6ª menor 8 · 6ª mayor 9 · 7ª menor 10 · 7ª mayor 11 · octava 12 (semitonos = trastes).'});
L('teoria',2,'th4','Cómo se forma un acorde','Saber qué notas tiene cada acorde.',['Mayor = raíz + 3ª mayor + 5ª justa (0-4-7).','Menor = raíz + 3ª menor + 5ª justa (0-3-7).','Séptima (7) = mayor + 7ª menor (0-4-7-10); maj7 = mayor + 7ª mayor (0-4-7-11).'],'Ejemplo: Do mayor = Do-Mi-Sol; Do menor = Do-Re#-Sol.',{quiz:{t:['chord'],n:8},learn:'Un acorde son notas que suenan juntas, apiladas en terceras. Lo que cambia entre mayor y menor es solo la 3ª: un traste.'});
L('teoria',2,'th5','Notas en todo el mástil','Encontrar cualquier nota en cualquier cuerda.',['Usa octavas: desde la 6ª cuerda, 2 trastes más arriba y 2 cuerdas abajo está la misma nota.','Aprende primero las notas naturales de cada cuerda.','Responde el quiz.'],'5 minutos al día con este quiz y en un mes lo dominas.',{quiz:{t:['notes'],n:12,o:{f:12}},learn:'Octavas: en la 6ª y 5ª cuerda la octava está 2 cuerdas abajo y 2 trastes arriba. En la 4ª y 3ª, también 2 trastes arriba. Con la 2ª cuerda (Si) se corre un traste más.'});
L('teoria',3,'th6','Grados y armonía de una tonalidad','Saber qué acordes van juntos.',['En una tonalidad mayor los acordes son: I mayor, ii menor, iii menor, IV mayor, V mayor, vi menor, vii disminuido.','En Do: Do, Rem, Mim, Fa, Sol, Lam, Si°.','Responde el quiz.'],'I-V-vi-IV es la progresión más famosa del pop.',{quiz:{t:['deg'],n:10},learn:'Patrón de los 7 acordes de una tonalidad mayor: Mayor · menor · menor · Mayor · Mayor · menor · disminuido. Sirve para transportar canciones y entender por qué ciertos acordes "suenan bien juntos".'});
L('teoria',3,'th7','La escala mayor por grados','Saber las notas de cualquier escala mayor.',['Fórmula: T-T-st-T-T-T-st (T = 2 trastes, st = 1 traste).','Sol mayor: Sol La Si Do Re Mi Fa#.','Responde el quiz.'],'Con esta fórmula construyes cualquier escala en cualquier cuerda.',{quiz:{t:['scale'],n:10},learn:'La escala mayor sigue la fórmula tono-tono-semitono-tono-tono-tono-semitono. Cada nota tiene un número (grado): 1 raíz, 3 la tercera, 5 la quinta…'});

L('oido',1,'o1','¿Más agudo o más grave?','Distinguir la dirección de una melodía.',['Escucha dos notas.','Decide si la segunda es más aguda o más grave.','Canta las dos notas antes de responder.'],'Cantar es la mejor forma de entrenar el oído.',{quiz:{t:['hilo'],n:8}});

L('musica',1,'m1','Tu primera canción','Tocar algo completo de principio a fin.',['Elige una canción con acordes que conozcas.','Aprende la estrofa lento (50%).','Tócala 4 veces seguidas sin parar.'],'Escribe el nombre de la canción en la sesión diaria.');

L('can',1,'can1','Leer un cifrado (acordes sobre la letra)','Seguir cualquier cancionero de internet.',['En un cifrado el acorde va escrito JUSTO encima de la sílaba donde cambias. Si no hay letra, cada | es un compás.','Pon el metrónomo y practica este cifrado: | G | D | Em | C | (un acorde por compás, 4 vueltas).','Ahora con dos acordes en un compás: | G  D | Em  C | (cambia cada 2 clics).'],'Los acordes en inglés: C=Do, D=Re, E=Mi, F=Fa, G=Sol, A=La, B=Si. "m" = menor.',{b:[60,90,10],cue:['G','D','Em','C']});
L('can',1,'can2','Leer tablatura','Tocar riffs y punteos de cualquier canción.',['La tab tiene 6 líneas: la de ARRIBA es la 1ª cuerda (Mi agudo) y la de abajo la 6ª (Mi grave). El número es el traste; 0 = al aire.','Toca: 6ª cuerda 0 – 3 – 5, luego 5ª cuerda 2 – 3 – 2. Eso es un riff escrito en tab.','Símbolos: h = hammer-on, p = pull-off, b = bend, / = deslizar hacia arriba, ~ = vibrato.'],'La tab dice dónde, pero no cuánto dura: escucha siempre la canción original.',{b:[60,90,10],sub:1});
L('can',1,'can3','Power chords (acordes de quinta)','El acorde del rock y el punk.',['E5: 6ª al aire + 5ª y 4ª en el traste 2. A5: igual pero desde la 5ª cuerda.','G5: dedo 1 en el traste 3 de la 6ª, dedos 3 y 4 en el 5 de la 5ª y 4ª. Esa forma se mueve por todo el mástil.','Toca corcheas ↓ con palm mute cambiando E5 – G5 – A5 – D5.'],'El power chord no es mayor ni menor: por eso calza en casi cualquier canción de rock.',{b:[70,120,10],sub:2,pat:['D','D','D','D','D','D','D','D'],cue:['E5','G5','A5','D5']});
L('can',2,'can4','Capo y cambiar de tono','Tocar canciones en el tono de tu voz.',['Con capo en el traste 2, la forma de Sol suena como La (cada traste sube medio tono).','Toca G – C – D con capo en el 2 y luego en el 4. Canta encima: busca el traste donde tu voz se siente cómoda.','Truco: si una canción usa acordes difíciles (F, Bb), busca otro tono con capo y formas abiertas.'],'El capo no es trampa: lo usan los profesionales todo el tiempo.',{b:[60,90,10],cue:['G','C','D']});
L('can',2,'can5','La estructura de una canción','Entender el mapa antes de tocar.',['Casi todas las canciones son: Intro – Estrofa – Coro – Estrofa – Coro – Puente – Coro – Final.','Escucha 3 canciones que te gusten y escribe su estructura (con los compases de cada parte) en el Cuaderno → Mis canciones.','Cuando aprendas una canción, aprende parte por parte, no de principio a fin.'],'Muchas canciones repiten la misma progresión en estrofa y coro: lo que cambia es el ritmo y la melodía.',{nb:'song'});
L('can',2,'can6','Cantar y tocar a la vez','Acompañarte a ti mismo.',['Paso 1: rasguea negras ↓ en G – C – D mientras hablas (cuenta, di los acordes). La mano debe seguir sola.','Paso 2: tararea una melodía que conozcas encima.','Paso 3: canta la letra, primero a 70% de la velocidad real.'],'Si la mano se detiene al cantar, vuelve al paso 1: aún no está automática.',{b:[60,90,10],sub:2,pat:['D','','D','','D','','D',''],cue:['G','C','D']});
L('can',2,'can7','Ritmos por estilo','Elegir el rasgueo que pide cada canción.',['Balada: ↓ _ ↓↑ _ ↑↓↑ suave. Rock: corcheas ↓ con power chords. Reggae: solo los contratiempos (↑) con chasquido.','Toca La – Re – Mi con cada estilo, 4 compases cada uno.','Escucha una canción y decide cuál de los tres se parece más.'],'El estilo lo define la mano derecha más que los acordes.',{b:[70,100,5],sub:2,pat:['D','','D','U','','U','D','U'],cue:['A','D','E']});
L('can',3,'can8','Cumbia y ritmos latinos','El "chiqui-chiqui" de la cumbia.',['El pulgar toca el bajo en los tiempos 1 y 3; en los contratiempos va un chasquido corto (x).','Patrón: bajo _ x ↑ bajo _ x ↑.','Con La menor y Mi, luego Re menor – La menor – Mi.'],'La guitarra rítmica de cumbia es percusión: corto y seco.',{b:[70,110,5],sub:2,pat:['p','','x','U','p','','x','U'],cue:['Am','E']});
L('can',3,'can9','Sacar una canción de oído','Dejar de depender de los cancioneros.',['Encuentra la nota del bajo del primer acorde tocando la 6ª o 5ª cuerda hasta que coincida.','Supón que ese es el acorde I. Prueba los acordes de la tonalidad: I, IV, V y vi (el Generador del Cuaderno te los da).','Anota lo que encuentres en Mis canciones y compáralo después con un cifrado.'],'Empieza con canciones simples de 3-4 acordes: el pop y el rock son ideales.',{nb:'song'});
L('can',3,'can10','Tu repertorio de 5 canciones','Tener canciones listas para tocar cuando te pidan.',['Elige 5 canciones de estilos distintos y regístralas en Cuaderno → Mis canciones.','Llévalas una por una a "La toco entera" y luego a "La canto y toco".','Toca las 5 seguidas una vez a la semana, como un mini concierto.'],'Un repertorio pequeño y bien tocado vale más que 30 canciones a medias.',{nb:'song'});

L('comp',1,'co1','Progresiones por grados','Entender por qué ciertos acordes suenan bien juntos.',['En cada tonalidad hay 7 acordes: I, ii, iii, IV, V, vi, vii°. En Sol: G, Am, Bm, C, D, Em, F#°.','I – V – vi – IV es la progresión del pop; I – IV – V la del rock; ii – V – I la del jazz.','Responde el quiz y luego prueba el Generador de progresiones del Cuaderno.'],'Pensar en números te deja cambiar de tono sin reaprender nada.',{quiz:{t:['deg'],n:8},learn:'Los grados son la "gramática" de la música: el I es la casa (reposo), el V es la tensión que pide volver a casa, el IV es un paseo y el vi es la versión triste de la casa. Componer es elegir cuándo salir y cuándo volver.'});
L('comp',1,'co2','Tensión y reposo: el V que vuelve al I','Sentir cómo una progresión "pide" resolver.',['Toca Sol – Re7 y detente en Re7: sientes que falta algo. Eso es tensión.','Ahora Sol – Re7 – Sol: el regreso es el reposo.','Toca G – C – D7 – G y nota en qué acorde termina la frase.'],'Una canción sin tensión aburre; una sin reposo cansa.',{b:[60,90,10],cue:['G','C','D7','G']});
L('comp',1,'co3','Tu primera progresión guardada','Empezar tu archivo de ideas.',['Abre Cuaderno → Generador, elige un tono y un patrón y dale a ▶ escuchar.','Toca la progresión en la guitarra y cámbiale UN acorde por otro de la tonalidad.','Guárdala en Ideas con un nombre y una nota de cómo te hace sentir.'],'Las canciones nacen de ideas pequeñas guardadas a tiempo.',{nb:'gen'});
L('comp',2,'co4','Melodía sobre los acordes','Inventar melodías que calcen.',['Toca G – Em – C – D y en el tiempo 1 de cada compás canta una nota del acorde (Sol, Si o Re en G).','Entre esas notas usa la escala de Sol mayor para "caminar".','Graba la melodía con la voz del celular o anótala con las notas en el Cuaderno.'],'La melodía suena "bien" cuando cae en notas del acorde en los tiempos fuertes.',{b:[70,90,5],sc:['gmaj'],cue:['G','Em','C','D'],nb:'idea'});
L('comp',2,'co5','Riff: una idea corta que se repite','Crear el gancho de una canción.',['Con la pentatónica de La, inventa una frase de 2 compases que puedas cantar.','Repítela 3 veces igual y la 4ª cámbiale el final.','Pruébala sobre La menor y luego sobre Re menor.'],'Repetición + pequeña variación = gancho.',{b:[80,100,5],sc:['pent1'],nb:'idea'});
L('comp',2,'co6','Escribir una letra (prosodia)','Que las palabras calcen con el ritmo.',['Escribe de qué trata tu canción en UNA frase.','Las sílabas acentuadas de las palabras deben caer en los tiempos fuertes (di la frase en voz alta con el metrónomo).','Usa un esquema de rima: AABB o ABAB. Anota la letra en Ideas.'],'Primero di la frase como la hablarías; la melodía sale de ahí.',{b:[70,90,5],nb:'idea'});
L('comp',3,'co7','Estrofa y coro: contraste','Que el coro "despegue".',['Escribe una estrofa en registro bajo y rasgueo suave.','Para el coro sube la melodía, rasguea más fuerte y/o cambia la progresión (por ejemplo empieza en el IV).','Alterna estrofa y coro sin parar y escucha si se nota el cambio.'],'Contraste = la gente reconoce el coro sin que se lo digas.',{b:[70,100,5],cue:['Em','C','G','D'],nb:'idea'});
L('comp',3,'co8','Acordes prestados y de color','Sonidos más interesantes que los 7 acordes básicos.',['En Sol mayor prueba Do menor (iv menor) después de Do: suena nostálgico.','Prueba Fa (bVII) antes de Sol: suena a rock épico.','Prueba Si7 antes de Mi menor: es el V del vi y te lleva con fuerza al acorde triste.'],'Úsalos como especia: uno por progresión.',{b:[60,90,5],cue:['G','C','G','Em']});
L('comp',3,'co9','Modular: cambiar de tono','El último coro que sube.',['Toca tu coro en Sol. Para subirlo a La, toca Mi7 (el V de La) al final y entra en La.','Repite el coro completo en el tono nuevo.','Prueba también subir medio tono (de Sol a Lab con capo).'],'La modulación da energía al final, pero no la uses en todas las canciones.',{b:[70,100,5],cue:['G','D','E7','A']});
L('comp',3,'co10','Tu canción completa','Terminar una canción de principio a fin.',['Junta en el Cuaderno: estructura, progresión de cada parte, letra y melodía.','Tócala completa 3 días seguidos y ajusta lo que no te guste.','Grábala y guárdala en Mis canciones como "propia".'],'Terminada es mejor que perfecta. La siguiente saldrá mejor.',{nb:'idea'});

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const j=JSON.parse(localStorage.getItem('gd1'));if(j&&j.v===1)return j}catch(e){}return{v:1,setup:false,mins:20,prog:{},hist:{},song:'',theme:'dark'}}
let st=load();
function fill(){st.tests=st.tests||[];st.les=st.les||{};st.ev=st.ev||{};st.nb=st.nb||{};['log','pend','ideas','songs'].forEach(k=>st.nb[k]=st.nb[k]||[])}
fill();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
if(!st.ui2){st.ui2=true;st.theme='dark'}
function save(){try{localStorage.setItem('gd1',JSON.stringify(st))}catch(e){}}
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function pr(s){if(!st.prog[s]){const L=LV[s][0];st.prog[s]={lvl:0,bpm:L.b?L.b[0]:60,good:0,hard:0,ready:false}}return st.prog[s]}
const lvl=s=>LV[s][pr(s).lvl];
const today=()=>st.hist[dk()]||{sec:0,done:{}};
const active=h=>h&&(h.sec>0||Object.keys(h.done||{}).length>0);
function streak(){let n=0,d=new Date();if(!active(st.hist[dk(d)]))d.setDate(d.getDate()-1);while(active(st.hist[dk(d)])){n++;d.setDate(d.getDate()-1)}return n}
function addTime(sec){const h=st.hist[dk()]||(st.hist[dk()]={sec:0,done:{}});h.sec=(h.sec||0)+Math.max(0,sec|0)}
function plan(m){
  if(m===20)return[['warm',2],['dedos',4],['tec',2],['chords',3],['rhythm',2],['scales',2],['song',4],['free',1]];
  if(m===30)return[['warm',3],['dedos',6],['tec',4],['chords',5],['rhythm',3],['scales',4],['song',4],['free',1]];
  const rot=['tec','chords','rhythm','scales','song','free'],dn=Math.floor(new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())/864e5),s=(dn*2)%6,mn=[3,2];
  return[['warm',2],['dedos',3]].concat([0,1].map(i=>[rot[(s+i)%6],mn[i]]));
}

/* ============ PROGRESO DE LA ESCUELA ============ */
const passed=id=>!!(st.les[id]&&st.les[id].best>=70);
const lesOf=a=>LES.filter(l=>l.a===a);
function evLast(a){const e=st.ev[a];return e&&e.length?e[e.length-1]:null}
function areaScore(a){const e=evLast(a);if(e)return e.s;const ls=lesOf(a).filter(l=>st.les[l.id]);if(!ls.length)return null;return Math.round(ls.reduce((s,l)=>s+st.les[l.id].last,0)/ls.length)}
function unlocked(a){
  // Se pide aprobar 2 lecciones del nivel (o todas, si el nivel tiene menos de 2)
  const e=evLast(a),pl=lv=>lesOf(a).filter(l=>l.lv===lv&&passed(l.id)).length,need=lv=>Math.min(2,lesOf(a).filter(l=>l.lv===lv).length);
  let u=1;if(pl(1)>=need(1)||(e&&e.s>=60))u=2;if(u===2&&(pl(2)>=need(2)||(e&&e.s>=80)))u=3;return u;
}
function areaLevel(a){const u=unlocked(a),ls=lesOf(a),p=ls.filter(l=>passed(l.id)).length;return{u,p,n:ls.length,pct:Math.round(p/ls.length*100)}}
function nextMilestone(a){
  const u=unlocked(a),pl=lv=>lesOf(a).filter(l=>l.lv===lv&&passed(l.id)).length,need=lv=>Math.min(2,lesOf(a).filter(l=>l.lv===lv).length),f1=Math.max(0,need(1)-pl(1)),f2=Math.max(0,need(2)-pl(2));
  if(u===1)return`Aprueba ${f1} lección${f1===1?'':'es'} básica${f1===1?'':'s'} más (o saca 60% en la evaluación) para desbloquear Intermedio.`;
  if(u===2)return`Aprueba ${f2} lección${f2===1?'':'es'} intermedia${f2===1?'':'s'} más (o saca 80% en la evaluación) para desbloquear Avanzado.`;
  const left=lesOf(a).filter(l=>!passed(l.id)).length;return left?`Nivel avanzado desbloqueado: te quedan ${left} lecciones por aprobar.`:'¡Área completa! Mantén con la práctica diaria y vuelve a evaluarte cada mes.';
}
// Recomienda la siguiente lección: primero el área más débil, dentro del nivel desbloqueado
function recommend(){
  const out=[];
  AK.forEach(a=>{
    const u=unlocked(a),cand=lesOf(a).filter(l=>l.lv<=u&&!passed(l.id));if(!cand.length)return;
    const tried=cand.find(l=>st.les[l.id]),l=tried||cand[0],sc=areaScore(a);
    let w=(sc==null?55:sc)+lesOf(a).filter(x=>passed(x.id)).length*3-(tried?8:0);
    let why=sc==null?`Aún no tienes datos de ${AR[a].n}: esta lección te da una base.`:`${AR[a].n} está en ${sc}%${sc<60?', uno de tus puntos débiles':''}.`;
    if(tried)why=`La intentaste y sacaste ${st.les[l.id].best}%: repetirla ahora la afirma.`;
    out.push({l,w,why});
  });
  out.sort((x,y)=>x.w-y.w);return out;
}
function strengths(){const s=AK.map(a=>({a,s:areaScore(a)})).filter(x=>x.s!=null).sort((x,y)=>y.s-x.s);return s}
/* ============ DIAGRAMAS ============ */
function dgSVG(o){
  const sx=i=>16+i*10.4,top=26,rh=17;let base=o.base||1;
  if(o.f){const fs=o.f.filter(x=>x>0);if(fs.length&&Math.max(...fs)>4)base=Math.min(...fs)}
  let s='<svg class="dg" viewBox="0 0 84 104" xmlns="http://www.w3.org/2000/svg" role="img">';
  for(let i=0;i<6;i++)s+=`<line x1="${sx(i)}" y1="${top}" x2="${sx(i)}" y2="${top+rh*4}" stroke="currentColor" stroke-opacity=".6" stroke-width="1"/>`;
  for(let j=0;j<=4;j++)s+=`<line x1="${sx(0)}" y1="${top+j*rh}" x2="${sx(5)}" y2="${top+j*rh}" stroke="currentColor" stroke-opacity="${j===0&&base===1?1:.35}" stroke-width="${j===0&&base===1?3:1}"/>`;
  if(base>1)s+=`<text x="1" y="${top+rh/2+3}" font-size="9" fill="currentColor" opacity=".7">${base}</text>`;
  const dot=(i,f,root)=>{const y=top+(f-base+.5)*rh;return`<circle cx="${sx(i)}" cy="${y}" r="5" fill="${root?'var(--accent)':'currentColor'}"/>`};
  if(o.f){
    if(o.b){const[bf,a,z]=o.b,y=top+(bf-base+.5)*rh;s+=`<rect x="${sx(a)-6}" y="${y-6}" width="${sx(z)-sx(a)+12}" height="12" rx="6" fill="currentColor"/>`}

const RT={C:0,D:2,E:4,F:5,G:7,A:9,B:11,Do:0,Re:2,Mi:4,Fa:5,Sol:7,La:9,Si:11};
function parseCh(s){const m=String(s).match(/^(Sol|Do|Re|Mi|Fa|La|Si|[A-G])([#b]?)(.*)$/);if(!m)return null;
  const r=(RT[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12,q=m[3].replace(/[()\s]/g,'').toLowerCase();
  let iv=[0,4,7];if(/^maj7/.test(q))iv=[0,4,7,11];else if(/^(m7|min7)/.test(q))iv=[0,3,7,10];else if(/^(dim|°|o)/.test(q))iv=[0,3,6];else if(/^5/.test(q))iv=[0,7,12];else if(/^sus4/.test(q))iv=[0,5,7];else if(/^sus2/.test(q))iv=[0,2,7];else if(/^7/.test(q))iv=[0,4,7,10];else if(/^(m|min|-)/.test(q))iv=[0,3,7];
  return{r,iv}}
const splitCh=s=>String(s||'').split(/[\s,|]+/).filter(x=>x&&parseCh(x));
let PG={tm:[]};
function playProg(list,bpm){
  PG.tm.forEach(clearTimeout);PG.tm=[];Met.ensure();const c=Met.ctx,beat=60/(bpm||80),t0=c.currentTime+.08;
  list.forEach((ch,i)=>{const p=parseCh(ch);if(!p)return;const bass=40+((p.r-4+12)%12),tops=p.iv.map(x=>52+((p.r-4+12)%12)+x);
    for(let b=0;b<4;b++){const t=t0+(i*4+b)*beat;if(b%2===0)tone(bass,t,beat*1.8,.35);tops.forEach((m,k)=>tone(m,t+k*.018,beat*.9,b===0?.17:.1))}
    PG.tm.push(setTimeout(()=>document.querySelectorAll('.chs[data-pl] span').forEach((e,j)=>e.classList.toggle('on',j===i)),(i*4*beat+.08)*1000))});
  PG.tm.push(setTimeout(()=>document.querySelectorAll('.chs[data-pl] span').forEach(e=>e.classList.remove('on')),(list.length*4*beat+.1)*1000));
}

function finishL(s,w,extra){

}
function lessonAct(a){
  const[k,x,y]=a.split(':');
  if(k==='close')return closePlayer();
  if(k==='les'){return startLesson(x)}
  if(k==='dice'){P.rseq=shuf();return renderLesson()}
  if(k==='lgo'){if(P.running){P.running=false;Met.stop()}else{P.running=true;Met.start(P.bpm,P.L.sub||1,4,metCb)}$('#go').textContent=P.running?'⏸ Pausa':'▶ Seguir';return}
  if(k==='lb'){const d=+x*(P.L.b?P.L.b[2]:5);P.bpm=Math.max(30,Math.min(240,P.bpm+d));$('#bpmv').textContent=P.bpm;if(Met.on)Met.bpm=P.bpm;return}
  if(k==='lfin'){recStop();Met.stop();P.running=false;P.phase='rate';renderLesson();$('#player').scrollTop=0;return}
  if(k==='rt'){P.r[+x]=+y;return renderLesson()}
  if(k==='lsub'){
    const cr=AR[P.a].cr,s=Math.round(P.r.reduce((t,v)=>t+v,0)/(cr.length*2)*100);
    const w=cr.filter((c,i)=>P.r[i]<2).sort((m,n)=>P.r[cr.indexOf(m)]-P.r[cr.indexOf(n)]).map(c=>[c[0],c[2]]),good=cr.filter((c,i)=>P.r[i]===2).map(c=>c[0]);
    return finishL(s,w,{good});
  }
  if(k==='qstart'){P.phase='quiz';renderLesson();autoPlay();return}
  if(k==='play'){const q=P.quiz.qs[P.quiz.i];if(q.play)playNotes(q.play);return}
  if(k==='qa'){const Z=P.quiz;if(Z.ans[Z.i]!=null)return;Z.ans[Z.i]=+x;return renderLesson()}
  if(k==='qn'){const Z=P.quiz;if(Z.i<Z.qs.length-1){Z.i++;renderLesson();autoPlay();return}
    const ok=Z.qs.filter((q,i)=>q.opts[Z.ans[i]]===q.ans),s=Math.round(ok.length/Z.qs.length*100);
    const bad={};Z.qs.forEach((q,i)=>{if(q.opts[Z.ans[i]]!==q.ans)bad[q.t]=(bad[q.t]||0)+1});
    const w=Object.keys(bad).sort((m,n)=>bad[n]-bad[m]).map(t=>[QN[t]+' ('+bad[t]+' error'+(bad[t]>1?'es':'')+')',QTIP[t]]);
    const miss=Z.qs.filter((q,i)=>q.opts[Z.ans[i]]!==q.ans).map(q=>({q:q.q,ans:q.ans}));
    const types=[...new Set(Z.qs.map(q=>q.t))],good=types.filter(t=>!bad[t]).map(t=>QN[t]);
    return finishL(s,w,{miss,good});
  }
}

  if(a.startsWith('pb:')){const p=pr(P.skill),L=lvl(P.skill),d=+a.slice(3)*(L.b?L.b[2]:5);p.bpm=Math.max(30,Math.min(240,p.bpm+d));save();$('#bpmv').textContent=p.bpm;if(Met.on)Met.bpm=p.bpm;return}
